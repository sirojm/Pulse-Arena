name: Build PULSE ARENA Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/PulseArenaAndroid/**'
      - '.github/workflows/android-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: android/PulseArenaAndroid
        run: gradle --no-daemon assembleDebug
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PULSE_ARENA_v3_debug_APK
          path: android/PulseArenaAndroid/app/build/outputs/apk/debug/app-debug.apk
