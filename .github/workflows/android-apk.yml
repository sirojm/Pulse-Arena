name: Build PULSE ARENA Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/PulseArenaAndroid/**'
      - 'PulseArenaAndroid/**'
      - 'PULSE_ARENA_v3.0.1/android/PulseArenaAndroid/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK Platform 35
        run: |
          sdkmanager --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f 'android/PulseArenaAndroid/settings.gradle' ]]; then
            PROJECT_DIR='android/PulseArenaAndroid'
          elif [[ -f 'PULSE_ARENA_v3.0.1/android/PulseArenaAndroid/settings.gradle' ]]; then
            PROJECT_DIR='PULSE_ARENA_v3.0.1/android/PulseArenaAndroid'
          elif [[ -f 'PulseArenaAndroid/settings.gradle' ]]; then
            PROJECT_DIR='PulseArenaAndroid'
          else
            echo 'ERROR: Android project not found.'
            echo 'Expected settings.gradle under android/PulseArenaAndroid or PulseArenaAndroid.'
            find . -maxdepth 5 -name settings.gradle -print || true
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"
          ls -lah "$PROJECT_DIR"
          java -version
          gradle --version

      - name: Compile debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace --warning-mode all :app:assembleDebug 2>&1 | tee build.log

      - name: Confirm APK output
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK" || { echo "ERROR: APK missing at $APK"; exit 1; }
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v7
        with:
          name: PULSE_ARENA_v3-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Gradle log if build fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: PULSE_ARENA_build-error-log
          path: |
            **/PulseArenaAndroid/build.log
            **/app/build/reports/**
          if-no-files-found: ignore
          retention-days: 7
