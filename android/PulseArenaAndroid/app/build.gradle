plugins { id 'com.android.application' }

android {
    namespace 'id.pulsearena.controller'
    compileSdk 35
    defaultConfig {
        applicationId 'id.pulsearena.controller'
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName '3.0.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes { release { minifyEnabled false } }
}
